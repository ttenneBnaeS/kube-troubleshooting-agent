[project]
name = "kube-troubleshooting-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "kubernetes>=36.0.3",
    "langchain-anthropic>=1.5.6",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-voyageai>=0.4.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Backend modules are top-level packages (`graph`, `tools`, ...), not
# under a `backend` prefix, so tests import them from this directory.
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
filterwarnings = [
    # Upstream: starlette's TestClient nudging toward httpx2; not ours to fix.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["eval/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Tool docstrings are the descriptions the model reads, kept on one line
# so wrapping can't change them; scenario data is long string literals.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tracing env must be loaded before LangChain is imported (observability.tracing).
"api/main.py" = ["E402"]
"eval/__main__.py" = ["E402"]
"mcp_server/__main__.py" = ["E402"]
