# Failure mode: one of sixteen identical, healthy-looking pods is failing,
# and only its logs say so.
#
# `shard` is a StatefulSet of 16 replicas running the same script; the
# pod whose hostname is `shard-11` logs checksum mismatches and skips
# every segment, while the other fifteen log successful compactions. All
# sixteen are Running and Ready with zero restarts and no Warning events.
#
# Step-budget probe: the only way to find the bad shard is to read logs,
# one pod per tool call, and the plan/execute loop is capped at
# LOOP_GUARD_MAX (8). In ordinal order the agent reaches shard-7 before
# the guard fires. Unlike `noisy` (4 candidates, names hint which group
# to read), nothing distinguishes shard-11 from its siblings. This is
# expected to fail; the useful signal is what the diagnosis says when it
# does — whether it admits which shards it never checked.
apiVersion: v1
kind: Service
metadata:
  name: shard
spec:
  clusterIP: None
  selector:
    app: shard
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shard
spec:
  serviceName: shard
  replicas: 16
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: shard
  template:
    metadata:
      labels:
        app: shard
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: compactor
          image: busybox
          command: ["sh", "-c"]
          args:
            - |
              seg=0
              while true; do
                seg=$((seg+1))
                if [ "$HOSTNAME" = "shard-11" ]; then
                  echo "[$HOSTNAME] ERROR segment $seg: checksum mismatch (expected crc32 0x9f3a11c2, got 0x00000000); skipping compaction, segment left unmerged"
                else
                  echo "[$HOSTNAME] compacted segment $seg OK"
                fi
                sleep 5
              done
