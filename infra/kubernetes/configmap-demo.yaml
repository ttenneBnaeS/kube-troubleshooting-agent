# Failure mode: ConfigMap key mismatch — the ConfigMap exists and is
# mounted correctly, but the pod's `configMapKeyRef` asks for `LOG_LEVEL`
# while the ConfigMap actually defines `log_level`. Same
# CreateContainerConfigError symptom as secret-demo, but a different root
# cause and a different fix.
#
# Deliberately not resolvable from pod status alone, and not even from
# events alone in the general case: the fix depends on what the ConfigMap
# really contains, so the agent has to call describe_resource with
# kind=configmap to see the actual key list and spot the case mismatch.
# This is the scenario that exercises the configmap/secret support added
# to describe_resource in Week 5.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  log_level: debug
  listen_port: "8080"
  upstream_url: http://payments
---
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
  labels:
    app: configmap-demo
spec:
  containers:
    - name: main
      image: busybox
      command: ["sh", "-c", "echo started with log level $LOG_LEVEL; sleep 3600"]
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
