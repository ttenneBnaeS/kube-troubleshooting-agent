# Failure mode: missing Secret — the pod's env var pulls from a
# `secretKeyRef` naming a Secret that was never created, so the kubelet
# can't build the container's environment and the pod sticks in
# CreateContainerConfigError (never Running, zero restarts, no logs).
#
# Diagnosable from the initial sweep plus one hop: get_pod_status shows
# waiting/CreateContainerConfigError, and get_recent_events carries the
# specific `secret "db-credentials" not found` message that names the
# missing object. Container logs are useless here — the container never
# started — which is itself a useful thing for the planner to learn.
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  labels:
    app: secret-demo
spec:
  containers:
    - name: main
      image: busybox
      command: ["sh", "-c", "echo started; sleep 3600"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
